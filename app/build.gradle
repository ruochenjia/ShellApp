apply plugin: "com.android.application"

android {
    compileSdkVersion "android-S"
    buildToolsVersion '30.0.3'
    ndkVersion "23.0.7421159 rc5"

    defaultConfig {
        applicationId "com.mindrex.shell"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 48
        versionName "TestDev5"
        multiDexEnabled true
        useLibrary "android.test.mock"
        vectorDrawables.useSupportLibrary = true
        signingConfig signingConfigs.debug
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        encoding "GBK"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets.main {
        jniLibs.srcDir "../../../Android/dalvik-sdk/rt/lib"
    }

    externalNativeBuild {
        cmake {
            path "cmake/CMakeLists.txt"
            version "3.18.1"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation fileTree(include: ['*.jar'], dir: '../../../Android/dalvik-sdk/rt/lib/ext')
    implementation "androidx.room:room-runtime:2.3.0"
    implementation 'org.apache.commons:commons-compress:1.21'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.3.0"
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"
    implementation "com.google.android.material:material:1.4.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.github.Rosemoe.CodeEditor:editor:0.5.0"
    implementation project(":appsupport")
    compileOnly project(":annotation")
}
apply plugin: "com.android.application"

android {
    compileSdkVersion "android-S"
    buildToolsVersion "30.0.3"
    ndkVersion "23.0.7123448 rc1"

    defaultConfig {
        applicationId "com.mindrex.shell"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 48
        versionName "TestDev5"
        multiDexEnabled true
        useLibrary "android.test.mock"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.debug
            multiDexEnabled true
        }
        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            minifyEnabled false
            multiDexEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "cmake/CMakeLists.txt"
            version "3.10.2"
        }
    }
}

repositories {
    jcenter()
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.room:room-runtime:2.3.0"
    implementation "org.apache.commons:commons-compress:1.20"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.appcompat:appcompat:1.3.0"
    implementation "androidx.constraintlayout:constraintlayout:2.0.4"
    implementation "com.google.android.material:material:1.3.0"
    implementation "androidx.preference:preference:1.1.1"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.google.guava:guava:30.1.1-jre"
    implementation project(path: ":io")
    implementation project(":appsupport")
    compileOnly "de.robv.android.xposed:api:82"
    compileOnly project(path: ":annotation")
    compileOnly "de.robv.android.xposed:api:82:sources"
    def suVersion = "3.1.1"
    implementation "com.github.topjohnwu.libsu:core:${suVersion}"
    compileOnly "com.github.topjohnwu.libsu:service:${suVersion}"
    compileOnly "com.github.topjohnwu.libsu:io:${suVersion}"
    compileOnly "com.github.topjohnwu.libsu:busybox:${suVersion}"
}